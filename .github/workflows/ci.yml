name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # AWS Lambda and netlify dev run functions with require(esm) disabled.
      # Importing the function under the same flags catches a dependency that
      # only loads where require(esm) is on (why firebase-admin is pinned).
      - name: Import the function with Lambda's Node flags
        run: |
          node --no-experimental-require-module --no-experimental-detect-module \
            --input-type=module -e 'await import("./netlify/functions/ai.js")'

      - run: npm run build

      # An Anthropic key must never reach the browser bundle. -l prints only
      # file names, so a leaked key is not echoed into the CI log.
      - name: Check dist/ for Anthropic keys
        run: |
          if grep -rl "sk-ant" dist/; then
            echo "::error::Found 'sk-ant' in the files above. An Anthropic key is in the build."
            exit 1
          fi
